<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="late-shift">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f2a94e" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#f2a94e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f2a94e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="900" height="220" rx="14" fill="#14161c"/>

  <!-- dim halo behind the bulb -->
  <circle cx="120" cy="95" r="95" fill="url(#glow)"/>

  <!-- bulb glass -->
  <circle cx="120" cy="95" r="46" fill="#1c1f27" stroke="#3a3f4b" stroke-width="2"/>

  <!-- filament, lit low -->
  <g stroke="#f2a94e" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#soften)" opacity="0.9">
    <path d="M104 78 Q120 70 136 78 Q120 95 104 78"/>
    <path d="M104 112 Q120 120 136 112 Q120 95 104 112"/>
    <line x1="120" y1="95" x2="120" y2="95"/>
  </g>
  <line x1="108" y1="66" x2="108" y2="124" stroke="#3a3f4b" stroke-width="1.5"/>
  <line x1="132" y1="66" x2="132" y2="124" stroke="#3a3f4b" stroke-width="1.5"/>

  <!-- screw base -->
  <rect x="107" y="139" width="26" height="30" rx="2" fill="#2a2d34" stroke="#3a3f4b" stroke-width="1.5"/>
  <line x1="107" y1="146" x2="133" y2="146" stroke="#3a3f4b" stroke-width="1.5"/>
  <line x1="107" y1="153" x2="133" y2="153" stroke="#3a3f4b" stroke-width="1.5"/>
  <line x1="107" y1="160" x2="133" y2="160" stroke="#3a3f4b" stroke-width="1.5"/>
  <path d="M112 169 L128 169 L123 178 L117 178 Z" fill="#2a2d34" stroke="#3a3f4b" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="225" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="600" fill="#e5e1d8">late-shift</text>
  <text x="228" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b8f99">Claude Code skills for the after-hours build</text>
</svg>
